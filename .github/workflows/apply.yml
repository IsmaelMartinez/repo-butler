name: Governance Apply

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (log only, no PRs)'
        default: 'true'
      tools:
        description: 'Comma-separated tools to apply (blank = all actionable; "dependabot-rebase" = nudge stale Dependabot PRs only; "code-review-bot" = enable Copilot review rulesets only; "dependabot-security" = enable GitHub Dependabot security updates on dependabot-sourced open-vulnerability repos only — ADR-012 settings write, manual dispatch only, needs App administration: write to go live; "dependabot-security-off" = the reversal — DELETE the setting on the same targets (reverts the setting only, NOT any bump PR GitHub already opened; explicit dispatch only, never fires on a blank run); "lockfile-update" = refresh package-lock.json for stalled npm alerts the trimmer classified reachable-by-update and open one PR per repo and lockfile directory — ADR-015 content-transformation write, explicit dispatch only, never fires on a blank run; dry-run runs npm and the gate and prints the diff it would open. All settings writes are dry-run by default.'
        required: false
      max-apply-per-run:
        description: 'Per-run cap: max PRs opened AND max repos acted on by a settings write (Copilot review / dependabot-security) per run (default 5)'
        required: false
        default: '5'

# Cross-repo writes use the GitHub App token generated in the job, not the
# workflow GITHUB_TOKEN — the default token only needs read access for checkout.
permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24, not 22: lockfile-update runs the ambient npm, and npm 10 (Node 22)
          # strips the `libc` field npm 11 writes into platform-binary entries, so
          # every refresh of an npm-11 lockfile gained out-of-family changes and
          # the ADR-015 gate refused it (2026-09-26 dry-run: yourear, sound3fy).
          node-version: '24'

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run apply phase
        id: apply
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_PHASE: apply
          INPUT_CONFIG_PATH: .github/roadmap.yml
          INPUT_DRY_RUN: ${{ github.event.inputs.dry-run || 'true' }}
          INPUT_TOOLS: ${{ github.event.inputs.tools || '' }}
          INPUT_MAX_APPLY_PER_RUN: ${{ github.event.inputs.max-apply-per-run || '5' }}
        run: node src/index.js

      - name: Run summary
        # The ADR-009 / ADR-012 settings writes (Copilot review, Dependabot
        # security updates) open no PR, so this summary IS their audit record —
        # the "see what it did" moment a PR diff would otherwise provide. Emitted
        # for every manual dispatch, dry-run or live.
        if: always()
        env:
          APPLY: ${{ steps.apply.outputs.apply }}
          NUDGE: ${{ steps.apply.outputs.nudge }}
          COPILOT_REVIEW: ${{ steps.apply.outputs.copilotReview }}
          DEPENDABOT_SECURITY: ${{ steps.apply.outputs.dependabotSecurity }}
          DEPENDABOT_SECURITY_OFF: ${{ steps.apply.outputs.dependabotSecurityOff }}
          LOCKFILE_UPDATE: ${{ steps.apply.outputs.lockfileUpdate }}
          DRY_RUN: ${{ github.event.inputs.dry-run || 'true' }}
        run: |
          mode="dry-run"
          [ "$DRY_RUN" = "false" ] && mode="LIVE"
          {
            echo "## Governance Apply ($mode)"
            echo ""
            echo "Manual dispatch (ADR-005 gate 1). The two settings writes below open no PR, so this line is their audit record."
            echo ""
            echo "- Apply summary: \`${APPLY:-(none — dry-run or nothing actionable)}\`"
            echo "- Nudge summary: \`${NUDGE:-(none — dry-run or nothing actionable)}\`"
            echo "- Copilot-review (settings write) summary: \`${COPILOT_REVIEW:-(none — not requested or nothing actionable)}\`"
            # ADR-012: manual-dispatch only — this is the ONLY workflow that runs
            # the Dependabot security-updates settings write, and its reversal.
            echo "- Dependabot-security (settings write) summary: \`${DEPENDABOT_SECURITY:-(none — not requested or nothing actionable)}\`"
            # ADR-012 reversal (tools=dependabot-security-off): the DELETE reverts
            # the setting only, never a bump PR GitHub already opened.
            echo "- Dependabot-security-off (reversal) summary: \`${DEPENDABOT_SECURITY_OFF:-(none — not requested)}\`"
            # ADR-015 (tools=lockfile-update): the dry-run preview in the job log
            # is the diff the PR would carry; this line is the count.
            echo "- Lockfile-update (ADR-015 content write) summary: \`${LOCKFILE_UPDATE:-(none — not requested)}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Governance apply ($mode)::apply=${APPLY:-none} nudge=${NUDGE:-none} copilotReview=${COPILOT_REVIEW:-none} dependabotSecurity=${DEPENDABOT_SECURITY:-none} dependabotSecurityOff=${DEPENDABOT_SECURITY_OFF:-none} lockfileUpdate=${LOCKFILE_UPDATE:-none}"
