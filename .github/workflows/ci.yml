name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Matches action.yml's `using: node24` — the gate should run the runtime
      # it guards, not an older one.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # A `describe` callback that throws builds no subtests, so node:test
      # reports the suite as `not ok` in TAP while the footer still says
      # `# fail 0` — and on Node 22 that did not reach the exit code either.
      # That shipped a broken suite as a green `test` check on run 33000289833:
      # thirteen tests silently stopped existing, including the guard that
      # merged PR titles pass through the prompt sanitiser. Asserting on TAP is
      # version-independent, and a genuinely failing test also emits `not ok`,
      # so this can only be stricter than the exit code, never weaker.
      # No workflow input is interpolated here — it reads only npm's own output.
      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          if grep -qE '^[[:space:]]*not ok [0-9]+' test-output.txt; then
            echo "TAP reported 'not ok' — a suite failed or failed to build, even if the summary says 0 failures."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Check for API key leaks
        run: |
          # Ensure no API keys are hardcoded in source files
          # Exclude safety.js and test files (they contain patterns and fixtures, not real keys)
          if grep -rn 'AIza\|sk-ant-\|sk-[a-zA-Z0-9]\{40\}\|-----BEGIN RSA PRIVATE KEY-----\|-----BEGIN EC PRIVATE KEY-----\|github_pat_' src/ --include='*.js' --exclude='safety.js' --exclude='*.test.js'; then
            echo "ERROR: Potential API key found in source code"
            exit 1
          fi

      - name: Check for unsafe URL patterns
        run: |
          # Ensure API keys are not in URL query parameters
          if grep -rn 'key=.*apiKey\|key=.*this\.' src/ --include='*.js' --exclude='safety.js' --exclude='*.test.js'; then
            echo "ERROR: API key passed in URL query parameter"
            exit 1
          fi
